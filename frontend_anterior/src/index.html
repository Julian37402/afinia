<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <title>AFINIA</title>

  <base href="/" />

  <meta name="color-scheme" content="light" />
  <meta name="theme-color" content="#5B37B7" />
  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="msapplication-tap-highlight" content="no" />

  <link rel="icon" type="image/png" href="assets/icon/favicon.png" />

  <!-- Tipografías de AFINIA: Bricolage Grotesque (títulos) + Inter (cuerpo).
       Si no hay conexión se usa la fuente del sistema (ver --af-font-* en theme/variables.scss). -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet" />

  <!-- add to homescreen for ios -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
</head>

<body>
  <app-root></app-root>
</body>

</html>
